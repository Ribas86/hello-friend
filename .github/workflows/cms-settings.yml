name: CMS company settings (test)
# Название и адрес компании в «Настройках сайта» на ТЕСТОВОМ сервере.
on:
  push:
    branches: [cms-settings-company]
concurrency: deploy-test
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Настроить SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Выполнить на сервере
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/quality && docker compose exec -T -e PUBLIC_URL=http://localhost:8055 cms node scripts/settings-company.mjs && sleep 65 && curl -s http://localhost/ | grep -o 'Центр[^<]\{0,14\}' | sort | uniq -c"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
