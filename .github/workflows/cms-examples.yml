name: CMS examples (test)
# Примеры объектов портфолио на ТЕСТОВОМ сервере.
# Пуш в ветку cms-examples-add — добавить, в cms-examples-remove — удалить (адреса primer-*).
on:
  push:
    branches: [cms-examples-add, cms-examples-remove]
concurrency: deploy-test
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Настроить SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Выполнить на сервере
        run: |
          ACTION=$([ "$GITHUB_REF_NAME" = "cms-examples-remove" ] && echo remove || echo add)
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/quality && docker compose exec -T -e PUBLIC_URL=http://localhost:8055 cms node scripts/examples.mjs $ACTION"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
