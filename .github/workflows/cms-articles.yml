name: CMS articles (test)
# Публикация статей в CMS на ТЕСТОВОМ сервере. Запускается пушем в ветку cms-articles.
on:
  push:
    branches: [cms-articles]
concurrency: deploy-test
permissions:
  contents: read
jobs:
  articles:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Настроить SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Записать статьи
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'rm -rf /tmp/cms-content && mkdir -p /tmp/cms-content'
          scp -i ~/.ssh/id_deploy -r cms/content/. "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cms-content/"
          scp -i ~/.ssh/id_deploy cms/scripts/articles-publish.mjs "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cms-content/"
          scp -i ~/.ssh/id_deploy cms/scripts/articles-remote.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cms-content/"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "CONTENT_FILE='$CONTENT_FILE' SLUGS='$SLUGS' bash /tmp/cms-content/articles-remote.sh"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CONTENT_FILE: articles-2026-11-28-skud.json
          SLUGS: skud-dlya-biznes-centra
