name: CMS articles (test)
# Публикация статей в CMS на ТЕСТОВОМ сервере. Запускается пушем в ветку cms-articles.
on:
  push:
    branches: [cms-articles]
concurrency: deploy-test
permissions:
  contents: read
jobs:
  articles:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Настроить SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Записать статьи
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'rm -rf /tmp/cms-content && mkdir -p /tmp/cms-content'
          scp -i ~/.ssh/id_deploy -r cms/content/. "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cms-content/"
          scp -i ~/.ssh/id_deploy cms/scripts/articles-publish.mjs "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cms-content/"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "CONTENT_FILE=$CONTENT_FILE SLUGS='$SLUGS' bash -s" <<'REMOTE'
            set -e
            cd /opt/quality
            docker compose exec -T cms rm -rf /app/content
            docker compose cp /tmp/cms-content/. cms:/app/content
            docker compose cp /tmp/cms-content/articles-publish.mjs cms:/app/scripts/articles-publish.mjs
            docker compose exec -T -e PUBLIC_URL=http://localhost:8055 cms node scripts/articles-publish.mjs "content/$CONTENT_FILE"
            sleep 65
            for s in $SLUGS; do
              printf "%s: " "$s"; curl -s -o /dev/null -w "%{http_code}\n" "http://localhost/articles/$s"
            done
            rm -rf /tmp/cms-content
          REMOTE
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CONTENT_FILE: articles-2026-11-21.json
          SLUGS: shlagbaum-s-upravleniem-s-telefona-cena
